<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930">
  <rect width="1600" height="930" fill="#F5F7F9"/><text x="60" y="58" font-family="Arial" font-size="32" font-weight="700" fill="#315F86">AS-IS SCENARIO MAP · ANDREA RAMOS</text><text x="60" y="90" font-family="Arial" font-size="18" fill="#68727B">Atención veterinaria actual con información fragmentada · Escenario mock</text>
  <g font-family="Arial" font-size="17" fill="#1E2B36"><rect x="50" y="125" width="1500" height="700" rx="16" fill="#FFFFFF" stroke="#AAB5BE" stroke-width="2"/>
  <rect x="50" y="125" width="210" height="700" rx="16" fill="#E4EDF5"/><text x="80" y="190" font-size="22" font-weight="700">PHASES</text><text x="80" y="325" font-size="22" font-weight="700">DOING</text><text x="80" y="500" font-size="22" font-weight="700">THINKING</text><text x="80" y="675" font-size="22" font-weight="700">FEELING</text>
  <g stroke="#C6CFD6"><line x1="260" y1="125" x2="260" y2="825"/><line x1="518" y1="125" x2="518" y2="825"/><line x1="776" y1="125" x2="776" y2="825"/><line x1="1034" y1="125" x2="1034" y2="825"/><line x1="1292" y1="125" x2="1292" y2="825"/><line x1="50" y1="250" x2="1550" y2="250"/><line x1="50" y1="425" x2="1550" y2="425"/><line x1="50" y1="600" x2="1550" y2="600"/></g>
  <g font-weight="700" fill="#315F86"><text x="280" y="190">1. Recibir caso</text><text x="538" y="190">2. Reconstruir</text><text x="796" y="190">3. Evaluar</text><text x="1054" y="190">4. Registrar</text><text x="1312" y="190">5. Seguimiento</text></g>
  <text x="280" y="300"><tspan x="280">Recibe llamada, audio,</tspan><tspan x="280" dy="26">texto o fotografías.</tspan></text><text x="538" y="300"><tspan x="538">Solicita cuadernos y</tspan><tspan x="538" dy="26">busca chats/archivos.</tspan></text><text x="796" y="300"><tspan x="796">Examina con los datos</tspan><tspan x="796" dy="26">que logró reunir.</tspan></text><text x="1054" y="300"><tspan x="1054">Escribe notas y envía</tspan><tspan x="1054" dy="26">indicaciones.</tspan></text><text x="1312" y="300"><tspan x="1312">Usa calendario y</tspan><tspan x="1312" dy="26">consulta al productor.</tspan></text>
  <text x="280" y="475"><tspan x="280">“¿Cuál animal es y</tspan><tspan x="280" dy="26">qué tan urgente?”</tspan></text><text x="538" y="475"><tspan x="538">“¿Está completa y</tspan><tspan x="538" dy="26">vigente?”</tspan></text><text x="796" y="475"><tspan x="796">“Debo decidir con</tspan><tspan x="796" dy="26">estos datos.”</tspan></text><text x="1054" y="475"><tspan x="1054">“Deben entender qué</tspan><tspan x="1054" dy="26">se hizo.”</tspan></text><text x="1312" y="475"><tspan x="1312">“¿Cumplieron y cómo</tspan><tspan x="1312" dy="26">evolucionó?”</tspan></text>
  <text x="280" y="655" fill="#A3482F">[-] Presionada</text><text x="538" y="655" fill="#A3482F"><tspan x="538">[-] Frustrada por</tspan><tspan x="538" dy="28">el tiempo perdido</tspan></text><text x="796" y="655" fill="#315F86"><tspan x="796">[+] Concentrada</tspan><tspan x="796" dy="28">y responsable</tspan></text><text x="1054" y="655" fill="#2F6B4F"><tspan x="1054">[+] Aliviada si</tspan><tspan x="1054" dy="28">queda claro</tspan></text><text x="1312" y="655" fill="#A3482F"><tspan x="1312">[-] Preocupada si</tspan><tspan x="1312" dy="28">no obtiene respuesta</tspan></text></g>
  <rect x="60" y="850" width="1480" height="50" rx="10" fill="#FFF3D6"/><text x="85" y="881" font-family="Arial" font-size="17" fill="#6C5621">[?] Blank areas: frecuencia real, tiempo administrativo, retención legal, alcance de permisos y tolerancia a demoras de sincronización.</text>
</svg>
