<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#F3F6F9"/><text x="70" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#315F86">EMPATHY MAP · ANDREA RAMOS</text><text x="70" y="94" font-family="Arial" font-size="18" fill="#66727C">Veterinaria · Arquetipo mock compuesto</text>
  <g font-family="Arial" fill="#1E2B36"><rect x="55" y="125" width="410" height="215" rx="18" fill="#EAF2F8"/><text x="80" y="165" font-size="24" font-weight="700">WHO / NEEDS</text><text x="80" y="205" font-size="18">• Atiende varios productores.</text><text x="80" y="237" font-size="18">• Combina coordinación y campo.</text><text x="80" y="269" font-size="18">• Necesita historial y registro rápido.</text><text x="80" y="301" font-size="18">• Debe separar clientes y permisos.</text>
  <rect x="495" y="125" width="410" height="215" rx="18" fill="#EEF5F0"/><text x="520" y="165" font-size="24" font-weight="700">SAYS / HEARS</text><text x="520" y="205" font-size="18">• “Necesito antecedentes vigentes.”</text><text x="520" y="237" font-size="18">• Escucha al productor y trabajadores.</text><text x="520" y="269" font-size="18">• Contrasta con colegas y SENASA.</text><text x="520" y="301" font-size="18">• Sigue fuentes y protocolos técnicos.</text>
  <rect x="935" y="125" width="410" height="215" rx="18" fill="#F3F1FA"/><text x="960" y="165" font-size="24" font-weight="700">SEES / DOES</text><text x="960" y="205" font-size="18">• Ve fotos, chats y cuadernos.</text><text x="960" y="237" font-size="18">• Solicita y reconstruye antecedentes.</text><text x="960" y="269" font-size="18">• Evalúa, registra e indica.</text><text x="960" y="301" font-size="18">• Programa controles posteriores.</text>
  <rect x="55" y="370" width="410" height="215" rx="18" fill="#FFF7E8"/><text x="80" y="410" font-size="24" font-weight="700">THINKS &amp; FEELS</text><text x="80" y="450" font-size="18">• Responsabilidad clínica.</text><text x="80" y="482" font-size="18">• Presión por responder rápido.</text><text x="80" y="514" font-size="18">• Frustración ante datos incompletos.</text><text x="80" y="546" font-size="18">• Cuidado por la confidencialidad.</text>
  <circle cx="700" cy="480" r="112" fill="#315F86"/><text x="700" y="466" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">ANDREA</text><text x="700" y="505" text-anchor="middle" font-size="20" fill="#DCEAF5">34 · Veterinaria</text><text x="700" y="535" text-anchor="middle" font-size="16" fill="#DCEAF5">persona ficticia</text>
  <rect x="935" y="370" width="410" height="215" rx="18" fill="#FFF2ED"/><text x="960" y="410" font-size="24" font-weight="700">PAINS</text><text x="960" y="450" font-size="18">• Historial fragmentado.</text><text x="960" y="482" font-size="18">• Duplicidad y pérdida de tiempo.</text><text x="960" y="514" font-size="18">• Mala cobertura en visitas.</text><text x="960" y="546" font-size="18">• Permisos ambiguos.</text>
  <rect x="275" y="620" width="850" height="230" rx="18" fill="#E8F1F7" stroke="#315F86" stroke-width="2"/><text x="310" y="665" font-size="26" font-weight="700">GAINS</text><text x="310" y="710" font-size="20">• Consultar información autorizada y conocer su procedencia.</text><text x="310" y="750" font-size="20">• Registrar una atención en pocos pasos, incluso sin conexión.</text><text x="310" y="790" font-size="20">• Programar seguimientos y entregar indicaciones claras.</text><text x="310" y="830" font-size="20">• Auditar cambios, exportar y revisar indicadores básicos.</text></g>
  <text x="700" y="925" text-anchor="middle" font-family="Arial" font-size="17" fill="#66727C">Fuente: síntesis de entrevistas mock VET-M01–VET-M05 · septiembre de 2026</text>
</svg>
