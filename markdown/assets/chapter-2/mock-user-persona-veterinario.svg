<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#F2F6FA"/>
  <rect x="45" y="40" width="1310" height="820" rx="24" fill="#FFFFFF" stroke="#315F86" stroke-width="3"/>
  <rect x="45" y="40" width="1310" height="125" rx="24" fill="#315F86"/>
  <text x="85" y="95" font-family="Arial" font-size="36" font-weight="700" fill="#FFFFFF">USER PERSONA · VETERINARIA</text>
  <text x="85" y="135" font-family="Arial" font-size="20" fill="#DCEAF5">Arquetipo compuesto basado en VET-M01–VET-M05 · Datos sintéticos</text>
  <circle cx="205" cy="300" r="92" fill="#DCEAF5" stroke="#315F86" stroke-width="4"/>
  <text x="205" y="315" text-anchor="middle" font-family="Arial" font-size="62" font-weight="700" fill="#315F86">AR</text>
  <text x="90" y="430" font-family="Arial" font-size="34" font-weight="700" fill="#1E2B36">Andrea Ramos</text>
  <text x="90" y="468" font-family="Arial" font-size="20" fill="#485966">34 años · Sierra peruana</text>
  <text x="90" y="500" font-family="Arial" font-size="20" fill="#485966">Veterinaria · 12 productores</text>
  <text x="90" y="548" font-family="Arial" font-size="17" font-weight="700" fill="#A3482F">NOMBRE E IMAGEN FICTICIOS</text>
  <rect x="390" y="205" width="440" height="245" rx="16" fill="#EEF4FA"/>
  <text x="420" y="245" font-family="Arial" font-size="24" font-weight="700" fill="#315F86">OBJETIVOS</text>
  <text x="420" y="286" font-family="Arial" font-size="19" fill="#1E2B36">• Consultar antecedentes oportunamente.</text>
  <text x="420" y="322" font-family="Arial" font-size="19" fill="#1E2B36">• Registrar atenciones con rapidez.</text>
  <text x="420" y="358" font-family="Arial" font-size="19" fill="#1E2B36">• Programar y verificar seguimiento.</text>
  <text x="420" y="394" font-family="Arial" font-size="19" fill="#1E2B36">• Separar correctamente a sus clientes.</text>
  <rect x="860" y="205" width="440" height="245" rx="16" fill="#FFF2ED"/>
  <text x="890" y="245" font-family="Arial" font-size="24" font-weight="700" fill="#A3482F">FRUSTRACIONES</text>
  <text x="890" y="286" font-family="Arial" font-size="19" fill="#1E2B36">• Historiales fragmentados o incompletos.</text>
  <text x="890" y="322" font-family="Arial" font-size="19" fill="#1E2B36">• Identificadores inconsistentes.</text>
  <text x="890" y="358" font-family="Arial" font-size="19" fill="#1E2B36">• Duplicidad administrativa.</text>
  <text x="890" y="394" font-family="Arial" font-size="19" fill="#1E2B36">• Permisos ambiguos y mala cobertura.</text>
  <rect x="390" y="480" width="440" height="245" rx="16" fill="#F3F1FA"/>
  <text x="420" y="520" font-family="Arial" font-size="24" font-weight="700" fill="#58468C">COMPORTAMIENTOS</text>
  <text x="420" y="561" font-family="Arial" font-size="19" fill="#1E2B36">• Solicita fotos, notas y cuadernos.</text>
  <text x="420" y="597" font-family="Arial" font-size="19" fill="#1E2B36">• Reconstruye el historial del paciente.</text>
  <text x="420" y="633" font-family="Arial" font-size="19" fill="#1E2B36">• Registra y comunica indicaciones.</text>
  <text x="420" y="669" font-family="Arial" font-size="19" fill="#1E2B36">• Usa Android, laptop y calendario.</text>
  <rect x="860" y="480" width="440" height="245" rx="16" fill="#EEF5F0"/>
  <text x="890" y="520" font-family="Arial" font-size="24" font-weight="700" fill="#2F6B4F">NECESIDADES</text>
  <text x="890" y="561" font-family="Arial" font-size="19" fill="#1E2B36">• Acceso autorizado y auditable.</text>
  <text x="890" y="597" font-family="Arial" font-size="19" fill="#1E2B36">• Historial y registro clínico breve.</text>
  <text x="890" y="633" font-family="Arial" font-size="19" fill="#1E2B36">• Borradores offline y alertas.</text>
  <text x="890" y="669" font-family="Arial" font-size="19" fill="#1E2B36">• Exportación y reportes básicos.</text>
  <rect x="90" y="770" width="1210" height="54" rx="12" fill="#E7F0F7"/>
  <text x="695" y="805" text-anchor="middle" font-family="Arial" font-size="21" font-style="italic" fill="#294F6F">“Antes de tratar necesito los antecedentes y después dejar indicaciones claras.”</text>
</svg>
