<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930">
  <rect width="1600" height="930" fill="#F7F8F7"/><text x="60" y="58" font-family="Arial" font-size="32" font-weight="700" fill="#2F6B4F">AS-IS SCENARIO MAP · MARÍA QUISPE</text><text x="60" y="90" font-family="Arial" font-size="18" fill="#68726C">Registro y seguimiento actual de un evento sanitario · Escenario mock</text>
  <g font-family="Arial" font-size="17" fill="#1F2D26"><rect x="50" y="125" width="1500" height="700" rx="16" fill="#FFFFFF" stroke="#AAB6AF" stroke-width="2"/>
  <rect x="50" y="125" width="210" height="700" rx="16" fill="#E5EEE8"/><text x="80" y="190" font-size="22" font-weight="700">PHASES</text><text x="80" y="325" font-size="22" font-weight="700">DOING</text><text x="80" y="500" font-size="22" font-weight="700">THINKING</text><text x="80" y="675" font-size="22" font-weight="700">FEELING</text>
  <g stroke="#C7D0CA"><line x1="260" y1="125" x2="260" y2="825"/><line x1="518" y1="125" x2="518" y2="825"/><line x1="776" y1="125" x2="776" y2="825"/><line x1="1034" y1="125" x2="1034" y2="825"/><line x1="1292" y1="125" x2="1292" y2="825"/><line x1="50" y1="250" x2="1550" y2="250"/><line x1="50" y1="425" x2="1550" y2="425"/><line x1="50" y1="600" x2="1550" y2="600"/></g>
  <g font-weight="700" fill="#2F6B4F"><text x="280" y="190">1. Detectar</text><text x="538" y="190">2. Buscar historial</text><text x="796" y="190">3. Registrar</text><text x="1054" y="190">4. Coordinar</text><text x="1312" y="190">5. Seguimiento</text></g>
  <text x="280" y="300"><tspan x="280" dy="0">Observa síntomas o</tspan><tspan x="280" dy="26">una fecha próxima.</tspan></text><text x="538" y="300"><tspan x="538">Busca arete, cuaderno,</tspan><tspan x="538" dy="26">mensajes y fotos.</tspan></text><text x="796" y="300"><tspan x="796">Anota en papel o chat</tspan><tspan x="796" dy="26">para transcribir luego.</tspan></text><text x="1054" y="300"><tspan x="1054">Llama o envía</tspan><tspan x="1054" dy="26">evidencia al vet.</tspan></text><text x="1312" y="300"><tspan x="1312">Revisa apuntes y</tspan><tspan x="1312" dy="26">recuerda la acción.</tspan></text>
  <text x="280" y="475"><tspan x="280">“Debo actuar antes</tspan><tspan x="280" dy="26">de que empeore.”</tspan></text><text x="538" y="475"><tspan x="538">“¿Dónde quedó el</tspan><tspan x="538" dy="26">último tratamiento?”</tspan></text><text x="796" y="475"><tspan x="796">“Espero no olvidar</tspan><tspan x="796" dy="26">pasar este dato.”</tspan></text><text x="1054" y="475"><tspan x="1054">“¿Será suficiente la</tspan><tspan x="1054" dy="26">información?”</tspan></text><text x="1312" y="475"><tspan x="1312">“¿Cuándo corresponde</tspan><tspan x="1312" dy="26">el próximo control?”</tspan></text>
  <text x="280" y="655" fill="#A3482F">[-] Preocupada</text><text x="538" y="655" fill="#A3482F"><tspan x="538">[-] Frustrada</tspan><tspan x="538" dy="28">e insegura</tspan></text><text x="796" y="655" fill="#2F6B4F"><tspan x="796">[+] Deja constancia</tspan><tspan x="796" dy="28" fill="#A3482F">[-] Teme perderla</tspan></text><text x="1054" y="655" fill="#2F6B4F"><tspan x="1054">[+] Acompañada</tspan><tspan x="1054" dy="28">si obtiene respuesta</tspan></text><text x="1312" y="655" fill="#A3482F"><tspan x="1312">[-] Carga mental</tspan><tspan x="1312" dy="28">e incertidumbre</tspan></text></g>
  <rect x="60" y="850" width="1480" height="50" rx="10" fill="#FFF3D6"/><text x="85" y="881" font-family="Arial" font-size="17" fill="#6C5621">[?] Blank areas: tiempo real de búsqueda, conflictos entre registros, conectividad por localidad, datos mínimos y disposición de pago observada.</text>
</svg>
