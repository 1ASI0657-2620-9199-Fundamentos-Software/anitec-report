<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1127px;height:917px;background:#FFFFFF;" width="1127px" height="917px" viewBox="0 0 1127 917" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="15" y="37.118" fill="#000" font-size="22" textLength="1095.682" font-weight="700" font-family="Verdana">AniTec — Ciclo ADD v3 (SEI): estructura repetida en cada una de las 7 iteraciones de 4.3</text></g><ellipse cx="388.259" cy="67.737" rx="10" ry="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M233.667,166.905 L233.667,224.303 L542.851,224.303 L542.851,176.905 L532.851,166.905 L233.667,166.905" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M532.851,166.905 L532.851,176.905 L542.851,176.905 L532.851,166.905" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="239.667" y="184.975" fill="#000" font-size="13" textLength="282.972" font-family="Verdana">Lista de pendientes arquitectónicos de esta</text><text x="239.667" y="200.774" fill="#000" font-size="13" textLength="288.184" font-family="Verdana">iteración: concerns y riesgos trasladados de</text><text x="239.667" y="216.574" fill="#000" font-size="13" textLength="279.297" font-family="Verdana">la iteración anterior, QAS aún sin resolver.</text><path d="M499.239,234.303 L499.239,266.902 L479.239,270.902 L499.239,274.902 L499.239,307.5 A0,0 0 0 0 499.239,307.5 L783.317,307.5 A0,0 0 0 0 783.317,307.5 L783.317,244.303 L773.317,234.303 L499.239,234.303 A0,0 0 0 0 499.239,234.303" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M773.317,234.303 L773.317,244.303 L783.317,244.303 L773.317,234.303" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="505.239" y="252.373" fill="#000" font-size="13" textLength="242.557" font-family="Verdana">Se seleccionan y priorizan los drivers</text><text x="505.239" y="268.172" fill="#000" font-size="13" textLength="263.079" font-family="Verdana">(QAS, constraints, concerns de 4.2) que</text><text x="505.239" y="283.972" fill="#000" font-size="13" textLength="209.98" font-family="Verdana">esta iteración va a resolver, con</text><text x="505.239" y="299.771" fill="#000" font-size="13" textLength="206.642" font-family="Verdana">justificación explícita del orden.</text><rect x="297.28" y="246.318" width="181.959" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="307.28" y="268.382" fill="#000" font-size="12" textLength="160.16" font-family="Verdana">Establish Iteration Goal by</text><text x="307.28" y="282.966" fill="#000" font-size="12" textLength="161.959" font-family="Verdana">Selecting Drivers (4.3.X.2)</text><rect x="279.151" y="327.5" width="218.217" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="289.151" y="349.565" fill="#000" font-size="12" textLength="198.217" font-family="Verdana">Choose One or More Elements of</text><text x="289.151" y="364.149" fill="#000" font-size="12" textLength="186.311" font-family="Verdana">the System to Refine (4.3.X.3)</text><rect x="249.122" y="396.668" width="278.275" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="259.122" y="418.733" fill="#000" font-size="12" textLength="227.414" font-family="Verdana">Choose One or More Design Concepts</text><text x="259.122" y="433.317" fill="#000" font-size="12" textLength="258.275" font-family="Verdana">That Satisfy the Selected Drivers (4.3.X.4)</text><rect x="273.113" y="465.836" width="230.293" height="63.752" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="283.113" y="487.901" fill="#000" font-size="12" textLength="210.293" font-family="Verdana">Instantiate Architectural Elements,</text><text x="283.113" y="502.485" fill="#000" font-size="12" textLength="174.908" font-family="Verdana">Allocate Responsibilities, and</text><text x="283.113" y="517.069" fill="#000" font-size="12" textLength="162.908" font-family="Verdana">Define Interfaces (4.3.X.5)</text><path d="M521.762,545.473 L521.762,570.172 L501.762,574.172 L521.762,578.172 L521.762,602.871 A0,0 0 0 0 521.762,602.871 L856.184,602.871 A0,0 0 0 0 856.184,602.871 L856.184,555.473 L846.184,545.473 L521.762,545.473 A0,0 0 0 0 521.762,545.473" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M846.184,545.473 L846.184,555.473 L856.184,555.473 L846.184,545.473" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="527.762" y="563.543" fill="#000" font-size="13" textLength="313.422" font-family="Verdana">Diagramas C4/UML actualizados (contenedores,</text><text x="527.762" y="579.343" fill="#000" font-size="13" textLength="274.358" font-family="Verdana">componentes, secuencia, estados, etc.) +</text><text x="527.762" y="595.142" fill="#000" font-size="13" textLength="216.633" font-family="Verdana">decisiones de diseño registradas.</text><rect x="274.756" y="549.588" width="227.006" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="284.756" y="571.653" fill="#000" font-size="12" textLength="180.316" font-family="Verdana">Sketch Views (C4 &amp; UML) and</text><text x="284.756" y="586.237" fill="#000" font-size="12" textLength="207.006" font-family="Verdana">Record Design Decisions (4.3.X.6)</text><path d="M542.332,618.756 L542.332,643.455 L522.332,647.455 L542.332,651.455 L542.332,676.154 A0,0 0 0 0 542.332,676.154 L862.014,676.154 A0,0 0 0 0 862.014,676.154 L862.014,628.756 L852.014,618.756 L542.332,618.756 A0,0 0 0 0 542.332,618.756" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M852.014,618.756 L852.014,628.756 L862.014,628.756 L852.014,618.756" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="548.332" y="636.826" fill="#000" font-size="13" textLength="282.395" font-family="Verdana">Se revisa qué quedó "Diseño completo" vs.</text><text x="548.332" y="652.625" fill="#000" font-size="13" textLength="276.434" font-family="Verdana">"Implementación pendiente", y qué riesgo</text><text x="548.332" y="668.425" fill="#000" font-size="13" textLength="298.683" font-family="Verdana">se traslada explícitamente a la iteración N+1.</text><rect x="254.187" y="622.871" width="268.145" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="264.187" y="644.936" fill="#000" font-size="12" textLength="233.619" font-family="Verdana">Analysis of Current Design and Review</text><text x="264.187" y="659.52" fill="#000" font-size="12" textLength="248.145" font-family="Verdana">Iteration Goal — Kanban Board (4.3.X.7)</text><rect x="285.25" y="97.737" width="206.018" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="295.25" y="119.802" fill="#000" font-size="12" textLength="186.018" font-family="Verdana">Architectural Design Backlog N</text><text x="295.25" y="134.386" fill="#000" font-size="12" textLength="55.102" font-family="Verdana">(4.3.X.1)</text><polygon points="315.784,696.154,460.734,696.154,472.734,716.207,460.734,736.26,315.784,736.26,303.784,716.207,315.784,696.154" fill="#FFF" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="392.259" y="747.319" fill="#000" font-size="11" textLength="89.832" font-family="Verdana">no — se alcanza</text><text x="392.259" y="760.688" fill="#000" font-size="11" textLength="62.885" font-family="Verdana">el capstone</text><text x="315.784" y="707.213" fill="#000" font-size="11" textLength="90.514" font-family="Verdana">¿Quedan drivers</text><text x="315.784" y="720.582" fill="#000" font-size="11" textLength="113.18" font-family="Verdana">arquitectónicamente</text><text x="315.784" y="733.951" fill="#000" font-size="11" textLength="144.95" font-family="Verdana">significativos sin resolver?</text><text x="472.734" y="700.529" fill="#000" font-size="11" textLength="55.838" font-family="Verdana">sí — inicia</text><text x="472.734" y="713.898" fill="#000" font-size="11" textLength="75.684" font-family="Verdana">iteración N+1</text><path d="M547.004,771.26 L547.004,811.759 L527.004,815.759 L547.004,819.759 L547.004,860.257 A0,0 0 0 0 547.004,860.257 L884.803,860.257 A0,0 0 0 0 884.803,860.257 L884.803,781.26 L874.803,771.26 L547.004,771.26 A0,0 0 0 0 547.004,771.26" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M874.803,771.26 L874.803,781.26 L884.803,781.26 L874.803,771.26" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="553.004" y="789.33" fill="#000" font-size="13" textLength="274.435" font-family="Verdana">En AniTec el número de iteraciones (7) se</text><text x="553.004" y="805.129" fill="#000" font-size="13" textLength="286.965" font-family="Verdana">re-derivó directamente de los drivers reales</text><text x="553.004" y="820.929" fill="#000" font-size="13" textLength="316.799" font-family="Verdana">documentados en 4.2, no de un índice heredado</text><text x="553.004" y="836.728" fill="#000" font-size="13" textLength="274.257" font-family="Verdana">— ver 4.3.1 a 4.3.7 y el cierre de capítulo</text><text x="553.004" y="852.527" fill="#000" font-size="13" textLength="72.516" font-family="Verdana">en 4.3.7.7.</text><rect x="249.514" y="791.175" width="277.49" height="49.168" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="259.514" y="813.239" fill="#000" font-size="12" textLength="257.49" font-family="Verdana">Iteración 7 (Observabilidad y Confiabilidad</text><text x="259.514" y="827.823" fill="#000" font-size="12" textLength="168.545" font-family="Verdana">Operativa) cierra el capítulo</text><ellipse cx="388.259" cy="891.257" rx="11" ry="11" fill="none" style="stroke:#000;stroke-width:1;"/><ellipse cx="388.259" cy="891.257" rx="6" ry="6" fill="#FFF" style="stroke:#000;stroke-width:1;"/><line x1="388.259" y1="224.303" x2="388.259" y2="246.318" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,236.318,388.259,246.318,392.259,236.318,388.259,240.318" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="388.259" y1="295.486" x2="388.259" y2="327.5" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,317.5,388.259,327.5,392.259,317.5,388.259,321.5" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="388.259" y1="376.668" x2="388.259" y2="396.668" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,386.668,388.259,396.668,392.259,386.668,388.259,390.668" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="388.259" y1="445.836" x2="388.259" y2="465.836" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,455.836,388.259,465.836,392.259,455.836,388.259,459.836" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="388.259" y1="529.588" x2="388.259" y2="549.588" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,539.588,388.259,549.588,392.259,539.588,388.259,543.588" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="388.259" y1="598.756" x2="388.259" y2="622.871" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,612.871,388.259,622.871,392.259,612.871,388.259,616.871" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="388.259" y1="146.905" x2="388.259" y2="166.905" style="stroke:#000;stroke-width:1;"/><polygon points="384.259,156.905,388.259,166.905,392.259,156.905,388.259,160.905" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="472.734" y1="716.207" x2="874.014" y2="716.207" style="stroke:#000;stroke-width:1;"/><polygon points="870.014,428.379,874.014,418.379,878.014,42