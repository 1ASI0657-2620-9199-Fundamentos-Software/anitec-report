<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <rect width="1800" height="1280" fill="#F5F7F8"/><rect x="40" y="35" width="1720" height="1180" rx="24" fill="#FFFFFF" stroke="#CBD3D8" stroke-width="2"/>
  <text x="80" y="90" font-family="Arial" font-size="38" font-weight="700" fill="#243746">IMPACT MAP · ANITEC 2026</text><text x="80" y="126" font-family="Arial" font-size="19" fill="#60727F">Goals → Personas → Impacts → Deliverables → User Stories</text>
  <g font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF"><rect x="70" y="165" width="290" height="58" rx="10" fill="#2F6B4F"/><text x="100" y="202">BUSINESS GOALS</text><rect x="385" y="165" width="220" height="58" rx="10" fill="#315F86"/><text x="425" y="202">PERSONAS</text><rect x="630" y="165" width="330" height="58" rx="10" fill="#72588E"/><text x="675" y="202">IMPACTS</text><rect x="985" y="165" width="340" height="58" rx="10" fill="#A36A2F"/><text x="1030" y="202">DELIVERABLES</text><rect x="1350" y="165" width="370" height="58" rx="10" fill="#3E6677"/><text x="1400" y="202">USER STORIES</text></g>
  <g font-family="Arial" fill="#243746"><rect x="70" y="260" width="290" height="205" rx="14" fill="#E8F3EC"/><text x="92" y="296" font-size="21" font-weight="700">BG-01 · Adopción</text><text x="92" y="332" font-size="17"><tspan x="92">70 % de ganaderos registra</tspan><tspan x="92" dy="27">3+ eventos por semana</tspan><tspan x="92" dy="27">durante 4 semanas,</tspan><tspan x="92" dy="27">al finalizar el mes 6.</tspan></text>
  <rect x="70" y="490" width="290" height="205" rx="14" fill="#FFF2E8"/><text x="92" y="526" font-size="21" font-weight="700">BG-02 · Seguimiento</text><text x="92" y="562" font-size="17"><tspan x="92">Reducir 30 % las alertas</tspan><tspan x="92" dy="27">vencidas sin atención</tspan><tspan x="92" dy="27">respecto de la línea base</tspan><tspan x="92" dy="27">al finalizar el mes 6.</tspan></text>
  <rect x="70" y="720" width="290" height="205" rx="14" fill="#EAF2F8"/><text x="92" y="756" font-size="21" font-weight="700">BG-03 · Continuidad</text><text x="92" y="792" font-size="17"><tspan x="92">80 % de visitas con</tspan><tspan x="92" dy="27">historial consultado y</tspan><tspan x="92" dy="27">atención registrada</tspan><tspan x="92" dy="27">dentro de 12 horas.</tspan></text>
  <rect x="70" y="950" width="290" height="205" rx="14" fill="#F1ECF6"/><text x="92" y="986" font-size="21" font-weight="700">BG-04 · Confianza</text><text x="92" y="1022" font-size="17"><tspan x="92">100 % conservado local;</tspan><tspan x="92" dy="27">95 % sincronizado en</tspan><tspan x="92" dy="27">5 min tras el retorno</tspan><tspan x="92" dy="27">de conexión estable.</tspan></text>
  <rect x="385" y="330" width="220" height="220" rx="20" fill="#EAF2F8"/><circle cx="495" cy="400" r="45" fill="#315F86"/><text x="495" y="410" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">MQ</text><text x="495" y="475" text-anchor="middle" font-size="23" font-weight="700">María Quispe</text><text x="495" y="510" text-anchor="middle" font-size="17">Ganadera</text>
  <rect x="385" y="735" width="220" height="220" rx="20" fill="#EAF2F8"/><circle cx="495" cy="805" r="45" fill="#315F86"/><text x="495" y="815" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">AR</text><text x="495" y="880" text-anchor="middle" font-size="23" font-weight="700">Andrea Ramos</text><text x="495" y="915" text-anchor="middle" font-size="17">Veterinaria</text>
  <rect x="630" y="260" width="330" height="210" rx="14" fill="#F1ECF6"/><text x="654" y="300" font-size="20" font-weight="700">Cambios de María</text><text x="654" y="340" font-size="17"><tspan x="654">• Registra cuando ocurre.</tspan><tspan x="654" dy="31">• Consulta antes de decidir.</tspan><tspan x="654" dy="31">• Confirma alertas.</tspan><tspan x="654" dy="31">• Controla y revoca accesos.</tspan></text>
  <rect x="630" y="500" width="330" height="210" rx="14" fill="#F1ECF6"/><text x="654" y="540" font-size="20" font-weight="700">Cambios compartidos</text><text x="654" y="580" font-size="17"><tspan x="654">• Trabajan aun sin señal.</tspan><tspan x="654" dy="31">• Revisan sincronización.</tspan><tspan x="654" dy="31">• Resuelven conflictos.</tspan><tspan x="654" dy="31">• Confían en la trazabilidad.</tspan></text>
  <rect x="630" y="740" width="330" height="210" rx="14" fill="#F1ECF6"/><text x="654" y="780" font-size="20" font-weight="700">Cambios de Andrea</text><text x="654" y="820" font-size="17"><tspan x="654">• Consulta antes de atender.</tspan><tspan x="654" dy="31">• Separa clientes/pacientes.</tspan><tspan x="654" dy="31">• Registra dentro de 12 h.</tspan><tspan x="654" dy="31">• Programa seguimiento.</tspan></text>
  <rect x="985" y="260" width="340" height="260" rx="14" fill="#FFF2E8"/><text x="1010" y="300" font-size="20" font-weight="700">Experiencia sanitaria</text><text x="1010" y="340" font-size="17"><tspan x="1010">• App Android y acciones rápidas.</tspan><tspan x="1010" dy="31">• Animales e historial.</tspan><tspan x="1010" dy="31">• Ficha clínica y versiones.</tspan><tspan x="1010" dy="31">• Alertas y seguimiento.</tspan><tspan x="1010" dy="31">• Guía inicial.</tspan></text>
  <rect x="985" y="550" width="340" height="260" rx="14" fill="#FFF2E8"/><text x="1010" y="590" font-size="20" font-weight="700">Colaboración segura</text><text x="1010" y="630" font-size="17"><tspan x="1010">• Solicitud y aprobación.</tspan><tspan x="1010" dy="31">• Alcance y vigencia.</tspan><tspan x="1010" dy="31">• Revocación.</tspan><tspan x="1010" dy="31">• Separación por propietario.</tspan><tspan x="1010" dy="31">• Auditoría.</tspan></text>
  <rect x="985" y="840" width="340" height="260" rx="14" fill="#FFF2E8"/><text x="1010" y="880" font-size="20" font-weight="700">Continuidad en campo</text><text x="1010" y="920" font-size="17"><tspan x="1010">• Persistencia local.</tspan><tspan x="1010" dy="31">• Estados de sincronización.</tspan><tspan x="1010" dy="31">• Reintentos idempotentes.</tspan><tspan x="1010" dy="31">• Resolución de conflictos.</tspan><tspan x="1010" dy="31">• Recuperación y exportación.</tspan></text>
  <rect x="1350" y="260" width="370" height="260" rx="14" fill="#E9F0F3"/><text x="1375" y="300" font-size="20" font-weight="700">US de valor sanitario</text><text x="1375" y="340" font-size="17"><tspan x="1375">US-010 · Registrar animal</tspan><tspan x="1375" dy="31">US-015 · Registrar incidencia</tspan><tspan x="1375" dy="31">US-016 · Registrar atención</tspan><tspan x="1375" dy="31">US-019 · Consultar historial</tspan><tspan x="1375" dy="31">US-027/028/070 · Alertas</tspan></text>
  <rect x="1350" y="550" width="370" height="260" rx="14" fill="#E9F0F3"/><text x="1375" y="590" font-size="20" font-weight="700">US de acceso y confianza</text><text x="1375" y="630" font-size="17"><tspan x="1375">US-023/071 · Solicitar/aprobar</tspan><tspan x="1375" dy="31">US-072 · Revocar acceso</tspan><tspan x="1375" dy="31">US-073 · Pacientes autorizados</tspan><tspan x="1375" dy="31">US-074 · Auditoría</tspan><tspan x="1375" dy="31">US-075/077 · Datos/versiones</tspan></text>
  <rect x="1350" y="840" width="370" height="260" rx="14" fill="#E9F0F3"/><text x="1375" y="880" font-size="20" font-weight="700">US de continuidad</text><text x="1375" y="920" font-size="17"><tspan x="1375">US-065 · Acceso Android</tspan><tspan x="1375" dy="31">US-066 · Guardado offline</tspan><tspan x="1375" dy="31">US-067 · Estado de sincronización</tspan><tspan x="1375" dy="31">US-068 · Reintento</tspan><tspan x="1375" dy="31">US-069 · Conflicto</tspan><tspan x="1375" dy="31">US-076/078 · Recuperación/guía</tspan></text></g>
  <text x="900" y="1190" text-anchor="middle" font-family="Arial" font-size="17" fill="#68727B">Artefacto vectorial para el informe · recrear/importar en UXPressia para captura y URL pública</text>
