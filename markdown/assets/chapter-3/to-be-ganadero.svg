  <g font-weight="700" fill="#2F6B4F"><text x="280" y="190">1. Detectar</text><text x="538" y="190">2. Consultar</text><text x="796" y="190">3. Registrar</text><text x="1054" y="190">4. Compartir</text><text x="1312" y="190">5. Sincronizar</text></g>
  <text x="280" y="300"><tspan x="280">Selecciona alerta</tspan><tspan x="280" dy="26">y animal.</tspan></text><text x="538" y="300"><tspan x="538">Consulta historial</tspan><tspan x="538" dy="26">disponible.</tspan></text><text x="796" y="300"><tspan x="796">Guarda evento</tspan><tspan x="796" dy="26">incluso offline.</tspan></text><text x="1054" y="300"><tspan x="1054">Solicita atención</tspan><tspan x="1054" dy="26">y concede acceso.</tspan></text><text x="1312" y="300"><tspan x="1312">Verifica estado y</tspan><tspan x="1312" dy="26">próxima actividad.</tspan></text>
  <text x="280" y="475"><tspan x="280">“Sé qué requiere</tspan><tspan x="280" dy="26">atención.”</tspan></text><text x="538" y="475"><tspan x="538">“Tengo reunidos</tspan><tspan x="538" dy="26">los antecedentes.”</tspan></text><text x="796" y="475"><tspan x="796">“Quedó guardado</tspan><tspan x="796" dy="26">sin señal.”</tspan></text><text x="1054" y="475"><tspan x="1054">“Yo controlo el</tspan><tspan x="1054" dy="26">acceso.”</tspan></text><text x="1312" y="475"><tspan x="1312">“Sé qué se envió</tspan><tspan x="1312" dy="26">y qué falta.”</tspan></text>
