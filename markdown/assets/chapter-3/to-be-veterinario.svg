<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930">
  <rect width="1600" height="930" fill="#F4F7FA"/><text x="60" y="58" font-family="Arial" font-size="32" font-weight="700" fill="#315F86">TO-BE SCENARIO MAP · ANDREA RAMOS</text><text x="60" y="90" font-family="Arial" font-size="18" fill="#68727B">Atención veterinaria autorizada, trazable y resiliente · Escenario mock</text>
  <g font-family="Arial" font-size="17" fill="#1E2B36"><rect x="50" y="125" width="1500" height="700" rx="16" fill="#FFFFFF" stroke="#AAB5BE" stroke-width="2"/><rect x="50" y="125" width="210" height="700" rx="16" fill="#E3EDF5"/>
  <text x="80" y="190" font-size="22" font-weight="700">PHASES</text><text x="80" y="325" font-size="22" font-weight="700">DOING</text><text x="80" y="500" font-size="22" font-weight="700">THINKING</text><text x="80" y="675" font-size="22" font-weight="700">FEELING</text>
  <g stroke="#C6CFD6"><line x1="260" y1="125" x2="260" y2="825"/><line x1="518" y1="125" x2="518" y2="825"/><line x1="776" y1="125" x2="776" y2="825"/><line x1="1034" y1="125" x2="1034" y2="825"/><line x1="1292" y1="125" x2="1292" y2="825"/><line x1="50" y1="250" x2="1550" y2="250"/><line x1="50" y1="425" x2="1550" y2="425"/><line x1="50" y1="600" x2="1550" y2="600"/></g>
  <g font-weight="700" fill="#315F86"><text x="280" y="190">1. Recibir caso</text><text x="538" y="190">2. Consultar</text><text x="796" y="190">3. Evaluar</text><text x="1054" y="190">4. Registrar</text><text x="1312" y="190">5. Seguimiento</text></g>
  <text x="280" y="300"><tspan x="280">Abre solicitud con</tspan><tspan x="280" dy="26">paciente autorizado.</tspan></text><text x="538" y="300"><tspan x="538">Consulta historial</tspan><tspan x="538" dy="26">y alertas.</tspan></text><text x="796" y="300"><tspan x="796">Evalúa y captura</tspan><tspan x="796" dy="26">observaciones.</tspan></text><text x="1054" y="300"><tspan x="1054">Guarda atención</tspan><tspan x="1054" dy="26">trazable/offline.</tspan></text><text x="1312" y="300"><tspan x="1312">Comparte indicación</tspan><tspan x="1312" dy="26">y programa control.</tspan></text>
  <text x="280" y="475"><tspan x="280">“Sé qué acceso</tspan><tspan x="280" dy="26">tengo.”</tspan></text><text x="538" y="475"><tspan x="538">“La información</tspan><tspan x="538" dy="26">tiene procedencia.”</tspan></text><text x="796" y="475"><tspan x="796">“Puedo trabajar</tspan><tspan x="796" dy="26">sin perder avance.”</tspan></text><text x="1054" y="475"><tspan x="1054">“La atención queda</tspan><tspan x="1054" dy="26">trazable.”</tspan></text><text x="1312" y="475"><tspan x="1312">“Puedo verificar</tspan><tspan x="1312" dy="26">la evolución.”</tspan></text>
  <g fill="#315F86"><text x="280" y="655">[+] Preparada</text><text x="538" y="655">[+] Informada</text><text x="796" y="655">[+] Concentrada</text><text x="1054" y="655">[+] Respaldada</text><text x="1312" y="655"><tspan x="1312">[+] En control</tspan><tspan x="1312" dy="28" fill="#A36A2F">[?] respuesta tardía</tspan></text></g></g>
  <rect x="60" y="850" width="1480" height="50" rx="10" fill="#FFF3D6"/><text x="85" y="881" font-family="Arial" font-size="17" fill="#6C5621">[?] Validar campos clínicos, conservación, acceso temporal, latencia y valor de indicadores.</text>
